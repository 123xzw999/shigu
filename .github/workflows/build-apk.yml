name: Build APK

# 手动触发，或改了打包相关文件时自动跑
on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'
      - 'core/**'
      - 'web/**'
      - 'data/turning_profiles.json'
      - 'data/sector_map.json'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "cython<3"

      # ~/.buildozer 里装着 Android SDK / NDK / p4a 源码，首次要下 2GB 左右。
      # 缓存住，之后每次构建能从 50 分钟降到 10 分钟出头。
      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build with buildozer
        env:
          # 关掉 buildozer 的交互提示，CI 里不能卡在 y/n
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          yes | buildozer -v android debug 2>&1 | tail -n 400

      - name: Show artifacts
        if: always()
        run: ls -la bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shigu-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
