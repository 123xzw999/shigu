name: Build APK

# 手动触发，或改了打包相关文件时自动跑
on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'
      - 'core/**'
      - 'web/**'
      - 'data/turning_profiles.json'
      - 'data/sector_map.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev ccache

      # p4a 装 kivy 时会独立解析 requests 的依赖，把 charset-normalizer 拉到 3.5.2
      # （只有 cp314-android 的 wheel，装不上）。用 pip 全局约束把它钉死。
      - name: Pin charset-normalizer
        run: echo "charset-normalizer==2.1.1" > "$GITHUB_WORKSPACE/constraints.txt"

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "cython<3"

      # ~/.buildozer 里装着 Android SDK / NDK / p4a 源码，首次要下 2GB 左右。
      # 缓存住，之后每次构建能从 50 分钟降到 10 分钟出头。
      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: Build with buildozer
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          # 必须 pipefail：否则 `| tail` 会把 buildozer 的失败吞成成功
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer.log | tail -n 300

      - name: Show artifacts
        if: always()
        run: ls -la bin/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shigu-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # 直接发到 Releases，手机上点链接就能下，不用登录 GitHub
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          NEW=$(basename "$APK")
          echo "APK: $NEW"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$APK" \
            --title "识股 APK · 最新构建" \
            --notes "构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')

          安装：下载 .apk → 允许「安装未知来源应用」→ 安装即可。
          首次打开会拉取行情，等 3~5 秒出界面。" \
            --prerelease
